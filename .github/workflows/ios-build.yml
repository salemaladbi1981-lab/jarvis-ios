name: iOS Build + Screenshots

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app (xcodebuild)
        run: |
          xcodebuild build \
            -project JARVIS.xcodeproj \
            -scheme JARVIS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: List simulators
        run: xcrun simctl list devices available | grep -i ipad | head

      - name: Boot iPad + deterministic screenshots
        run: |
          APP=$(find build -name "JARVIS.app" -type d 2>/dev/null | head -1)
          echo "APP=$APP"
          DEVICE="iPad Pro (11-inch) (4th generation)"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl install "$DEVICE" "$APP"

          shot() {
            local name="$1"; shift
            xcrun simctl terminate "$DEVICE" com.salemai.jarvis 2>/dev/null || true
            xcrun simctl launch "$DEVICE" com.salemai.jarvis "$@"
            sleep 6
            xcrun simctl io "$DEVICE" screenshot "$name.png"
          }

          # Portrait (default)
          shot portrait_core
          shot portrait_system   -group system
          shot portrait_content  -group content
          shot portrait_idle
          shot portrait_approval -state approval

          # Landscape (app requests landscape orientation via requestGeometryUpdate + two-zone layout)
          sleep 2
          shot landscape_core     -landscape
          shot landscape_system   -landscape -group system
          shot landscape_content  -landscape -group content
          shot landscape_listening -landscape -state listening
          shot landscape_approval -landscape -state approval

          ls -la *.png

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-ipad-screenshots
          path: '*.png'
