name: iOS Build + Screenshot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app (xcodebuild)
        run: |
          xcodebuild build \
            -project JARVIS.xcodeproj \
            -scheme JARVIS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Boot + install + launch + screenshots
        run: |
          APP=$(find build -name "JARVIS.app" -type d 2>/dev/null | head -1)
          echo "APP=$APP"
          xcrun simctl boot "iPhone 15" 2>/dev/null || true
          xcrun simctl install "iPhone 15" "$APP"
          xcrun simctl launch "iPhone 15" com.salemai.jarvis
          sleep 10
          xcrun simctl io "iPhone 15" screenshot core_group.png
          # scrolled to bottom — proves content clears the tab bar
          xcrun simctl terminate "iPhone 15" com.salemai.jarvis 2>/dev/null || true
          xcrun simctl launch "iPhone 15" com.salemai.jarvis -scrollBottom
          sleep 8
          xcrun simctl io "iPhone 15" screenshot scrolled_bottom.png
          ls -la *.png

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-screenshot
          path: '*.png'
