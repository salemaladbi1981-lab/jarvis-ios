name: iOS Build + Screenshots

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app (xcodebuild)
        run: |
          xcodebuild build \
            -project JARVIS.xcodeproj \
            -scheme JARVIS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Boot + install + deterministic screenshots
        run: |
          APP=$(find build -name "JARVIS.app" -type d 2>/dev/null | head -1)
          echo "APP=$APP"
          xcrun simctl boot "iPhone 15" 2>/dev/null || true
          xcrun simctl install "iPhone 15" "$APP"

          shot() {
            local name="$1"; shift
            xcrun simctl terminate "iPhone 15" com.salemai.jarvis 2>/dev/null || true
            xcrun simctl launch "iPhone 15" com.salemai.jarvis "$@"
            sleep 6
            xcrun simctl io "iPhone 15" screenshot "$name.png"
          }

          shot group_core
          shot group_system  -group system
          shot group_content -group content
          shot state_idle
          shot state_listening -state listening
          shot state_thinking   -state thinking
          shot state_speaking   -state speaking
          shot state_executing  -state executing
          shot state_alert      -state alert
          shot state_approval   -state approval

          ls -la *.png

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-screenshots
          path: '*.png'
