name: iOS + macOS Build + Screenshots

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run backend email tool tests (multi-account + grounded contract)
        run: |
          python3 phase3/backend/tests_realtime_tools.py
          python3 phase3/backend/tests_multi_email.py
          python3 phase3/backend/tests_microsoft.py
          python3 phase3/backend/tests_telegram.py
          python3 phase3/backend/tests_youtube.py
          for f in Tools/*_test.py; do python3 "$f" || exit 1; done

      - name: Run full backend suite (derivatives + isolation + security + workspace)
        env:
          JARVIS_STORAGE_ROOT: /tmp/jarvis-ci-storage
          JARVIS_SESSIONS: /tmp/jarvis-ci-sessions.json
          JARVIS_APPROVAL_PATH: /tmp/jarvis-ci-approvals.json
          JARVIS_AUDIT_PATH: /tmp/jarvis-ci-audit.jsonl
          JARVIS_AGENT_AUDIT: /tmp/jarvis-ci-agent-audit.jsonl
          JARVIS_AGENT_STATE: /tmp/jarvis-ci-agent-state.json
          JARVIS_ENROLL: /tmp/jarvis-ci-enroll.json
          JARVIS_KILL_SWITCH: /tmp/jarvis-ci-kill-switch.json
          JARVIS_MEMORY_DIR: /tmp/jarvis-ci-memories
          JARVIS_MEMORY_ROOT: /tmp/jarvis-ci-memories
        run: |
          python3 -m pip install --quiet fastapi 'httpx<0.28' pydantic Pillow
          cd phase3/backend
          # قائمة صريحة بالاختبارات المحمولة (بلا live-only: Hermes key / ذاكرة legacy / بريد/تليجرام live)
          for f in tests_derivatives.py tests_owner_negative.py tests_workspace_http.py tests_security.py \
                   tests_chat.py tests_inbox.py tests_conversation.py tests_worker.py tests_tg_handoff.py \
                   tests_auth.py tests_workspace.py tests_memory_isolation.py tests_tool_guard.py \
                   tests_approval_audit.py tests_config_language.py tests_enrollment.py \
                   tests_capabilities.py tests_phaseD.py tests_upload_auth.py tests_voice_stability.py \
                   tests_instagram.py tests_maps.py; do
            echo "== $f =="; python3 "$f" || exit 1
          done

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project JARVIS.xcodeproj \
            -scheme JARVIS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Boot iPhone + P5 screenshots (real UI via -demo, real API client)
        run: |
          APP=$(find build -name "JARVIS.app" -type d 2>/dev/null | head -1)
          DEVICE="iPhone 15"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl install "$DEVICE" "$APP"
          shot() {
            local name="$1"; shift
            xcrun simctl terminate "$DEVICE" com.salemai.jarvis 2>/dev/null || true
            sleep 2
            xcrun simctl launch "$DEVICE" com.salemai.jarvis -- "$@"
            sleep 6
            xcrun simctl io "$DEVICE" screenshot "$name.png"
          }
          shot args_proof -demo -tab home -showArgs
          shot home -demo -tab home
          shot chat -demo -tab chat
          shot inbox -demo -tab inbox
          shot tasks -demo -tab tasks
          shot deliveries -demo -tab deliveries
          ls -la *.png

      - name: Boot iPad (extra) + screenshots
        run: |
          APP=$(find build -name "JARVIS.app" -type d 2>/dev/null | head -1)
          DEVICE="iPad Pro (11-inch) (4th generation)"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl terminate "$DEVICE" com.salemai.jarvis 2>/dev/null || true
          sleep 2
          xcrun simctl launch "$DEVICE" com.salemai.jarvis -- -demo -tab home
          sleep 6
          xcrun simctl io "$DEVICE" screenshot ipad_home.png
          ls -la *.png

      - name: Real-contract screenshots (backend source + seed + iPhone)
        run: |
          APP=$(find build -name "JARVIS.app" -type d 2>/dev/null | head -1)
          python3 scripts/ci_real_screenshots.py "$APP" "iPhone 15"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: '*.png'

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS app
        run: |
          xcodebuild build \
            -project JARVIS.xcodeproj \
            -target "JARVIS Mac" \
            -sdk macosx \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Swift unit tests (macOS)
        run: |
          xcodebuild test \
            -project JARVIS.xcodeproj \
            -scheme JARVISTestsMac \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Launch macOS + screenshots
        run: |
          APP=$(find build ~/Library/Developer/Xcode/DerivedData -name "JARVIS Mac.app" -type d 2>/dev/null | head -1)
          echo "APP=$APP"
          shot() {
            local name="$1"; shift
            pkill -f "JARVIS Mac" 2>/dev/null || true
            sleep 1
            open "$APP" --args "$@"
            sleep 6
            screencapture -x "$name.png"
          }
          shot mac_core
          shot mac_system -group system
          shot mac_content -group content
          shot mac_listening -state listening
          shot mac_thinking -state thinking
          shot mac_speaking -state speaking
          shot mac_executing -state executing
          shot mac_alert -state alert
          shot mac_approval -state approval
          ls -la *.png

      - uses: actions/upload-artifact@v4
        with:
          name: mac-screenshots
          path: '*.png'
